[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results
markers =
    e2e: Full end-to-end test
    data_driven: Data-driven parametrized test
    smoke: Smoke test (quick verification)
